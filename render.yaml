# Blueprint لـ Render. يمكنك أيضًا إنشاء الخدمة يدويًا (راجع README).
services:
  - type: web
    name: abu-karim-auth
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # الصقه من Neon عند الإنشاء
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false        # رابط موقعك على Vercel
      - key: COOKIE_SAMESITE
        value: none
